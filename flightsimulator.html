<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Realistic ESP32 Flight Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; background: #90c8f5; font-family: monospace; }
    #connectBtn {
      position: absolute; top: 16px; left: 16px; z-index: 20;
      padding: 10px 18px; font-weight: bold; background: #00d26a;
      color: #000; border: none; border-radius: 6px; cursor: pointer;
    }
    #hud {
      position: absolute; bottom: 20px; left: 20px; z-index: 10;
      color: #00ff66; text-shadow: 0 0 5px rgba(0,255,102,0.8);
      font-size: 16px; pointer-events: none;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 24px; height: 24px;
      margin: -12px 0 0 -12px; pointer-events: none; display: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(0, 255, 100, 0.7);
    }
    #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
    #crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <button id="connectBtn">Connect ESP32 Controller</button>
  <div id="crosshair"></div>
  <div id="hud">
    <div>SPEED: <span id="hudSpd">0</span> KTS</div>
    <div>ALT:   <span id="hudAlt">0</span> FT</div>
    <div>CAM:   <span id="hudCam">CHASE</span></div>
  </div>

  <script>
    // --- 1. Scene & Lighting ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa4d4ff);
    scene.fog = new THREE.FogExp2(0xa4d4ff, 0.00075);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const sun = new THREE.DirectionalLight(0xfffaed, 1.3);
    sun.position.set(250, 400, 150);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x7085a0, 0.9));

    // --- 2. Ground & City Construction ---
    const groundGeo = new THREE.PlaneGeometry(6000, 6000);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x242729 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Runway / Main Avenue
    const roadGeo = new THREE.PlaneGeometry(60, 6000);
    const roadMat = new THREE.MeshBasicMaterial({ color: 0x161616 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.1;
    scene.add(road);

    // Procedural Textured Buildings
    function createBuildingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#454a52'; ctx.fillRect(0, 0, 128, 256);
      ctx.fillStyle = '#ffd97d';
      for (let y = 10; y < 250; y += 14) {
        for (let x = 8; x < 120; x += 12) {
          if (Math.random() > 0.35) ctx.fillRect(x, y, 6, 8);
        }
      }
      return new THREE.CanvasTexture(canvas);
    }
    const bTexture = createBuildingTexture();
    bTexture.wrapS = THREE.RepeatWrapping;
    bTexture.wrapT = THREE.RepeatWrapping;

    const bMat = new THREE.MeshLambertMaterial({ map: bTexture });
    const bGeo = new THREE.BoxGeometry(1, 1, 1);
    const buildingGrid = 30;

    for (let x = -buildingGrid; x <= buildingGrid; x += 4) {
      for (let z = -buildingGrid; z <= buildingGrid; z += 4) {
        if (Math.abs(x) < 4) continue; // Keep runway clear
        const h = 40 + Math.random() * 220;
        const w = 30 + Math.random() * 20;
        const b = new THREE.Mesh(bGeo, bMat);
        b.scale.set(w, h, w);
        b.position.set(x * 35, h / 2, z * 35);
        b.castShadow = true;
        scene.add(b);
      }
    }

    // --- 3. Dynamic Street Traffic ---
    const traffic = [];
    const carMatList = [0xd32f2f, 0x1976d2, 0xffffff, 0xfbc02d].map(c => new THREE.MeshLambertMaterial({ color: c }));
    for (let i = 0; i < 40; i++) {
      const car = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 6), carMatList[i % 4]);
      const laneX = (i % 2 === 0 ? -12 : 12);
      car.position.set(laneX, 1, (Math.random() - 0.5) * 3000);
      car.userData = { speed: (i % 2 === 0 ? 1 : -1) * (0.8 + Math.random() * 0.7) };
      scene.add(car);
      traffic.push(car);
    }

    // --- 4. Twin-Engine Plane Model ---
    const plane = new THREE.Group();
    const planeMat = new THREE.MeshLambertMaterial({ color: 0xf4f4f4 });
    const darkMat = new THREE.MeshLambertMaterial({ color: 0x1f242d });

    // Fuselage
    const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 0.7, 18, 16), planeMat);
    fuselage.rotation.x = Math.PI / 2;
    plane.add(fuselage);

    // Wings
    const mainWings = new THREE.Mesh(new THREE.BoxGeometry(26, 0.25, 3.5), planeMat);
    mainWings.position.set(0, 0.3, 1);
    plane.add(mainWings);

    // Tailfin & Horizontal Stabilizer
    const vTail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.5, 2.5), darkMat);
    vTail.position.set(0, 2, 7.5);
    plane.add(vTail);

    const hTail = new THREE.Mesh(new THREE.BoxGeometry(8, 0.2, 2), planeMat);
    hTail.position.set(0, 0.8, 7.5);
    plane.add(hTail);

    // Dual Engines & Spinners
    const props = [];
    [-5, 5].forEach(offset => {
      const nacelle = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 4, 12), darkMat);
      nacelle.rotation.x = Math.PI / 2;
      nacelle.position.set(offset, -0.1, 0.5);
      plane.add(nacelle);

      const prop = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.4, 0.05), new THREE.MeshBasicMaterial({ color: 0x222222 }));
      prop.position.set(offset, -0.1, -1.6);
      plane.add(prop);
      props.push(prop);
    });

    plane.position.set(0, 80, 0);
    scene.add(plane);

    // --- 5. Aerodynamic Flight Dynamics ---
    let targetPitch = 0, targetRoll = 0;
    let currentPitch = 0, currentRoll = 0, currentYaw = 0;
    let forwardSpeed = 1.6;
    let isFirstPerson = false;

    // --- 6. Web Serial Controller Input ---
    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        document.getElementById('connectBtn').style.display = 'none';

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        const reader = textDecoder.readable.getReader();

        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            try {
              const data = JSON.parse(line.trim());
              // Deadband and calibration mapping
              const rawX = Math.abs(data.ax) > 0.4 ? data.ax : 0;
              const rawY = Math.abs(data.ay) > 0.4 ? data.ay : 0;
              targetRoll = -(rawY / 9.8) * 1.3;
              targetPitch = (rawX / 9.8) * 0.9;

              if (data.btn === 1) {
                isFirstPerson = !isFirstPerson;
                document.getElementById('hudCam').innerText = isFirstPerson ? 'COCKPIT' : 'CHASE';
                document.getElementById('crosshair').style.display = isFirstPerson ? 'block' : 'none';
              }
            } catch (e) {}
          }
        }
      } catch (err) {
        console.error("Serial error:", err);
      }
    });

    // --- 7. Main Game Loop ---
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    function animate() {
      requestAnimationFrame(animate);

      // Smooth inertia on control surfaces
      currentRoll += (targetRoll - currentRoll) * 0.08;
      currentPitch += (targetPitch - currentPitch) * 0.08;

      // Realistic Bank-to-Turn (Adverse Yaw)
      currentYaw += -currentRoll * 0.025;

      // Apply rotation order
      euler.set(currentPitch, currentYaw, currentRoll, 'YXZ');
      plane.quaternion.setFromEuler(euler);

      // Forward velocity vector based on nose direction
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(plane.quaternion);
      plane.position.addScaledVector(forward, forwardSpeed);

      // Spin propellers
      props.forEach(p => p.rotation.z += 0.8);

      // Animate Ground Traffic
      traffic.forEach(car => {
        car.position.z += car.userData.speed;
        if (car.position.z > 2500) car.position.z = -2500;
        if (car.position.z < -2500) car.position.z = 2500;
      });

      // Camera Handling
      if (isFirstPerson) {
        camera.position.copy(plane.position);
        camera.quaternion.copy(plane.quaternion);
        camera.translateZ(-1.2);
        camera.translateY(0.4);
      } else {
        const chaseOffset = new THREE.Vector3(0, 6, 26).applyQuaternion(plane.quaternion);
        camera.position.lerp(plane.position.clone().add(chaseOffset), 0.25);
        camera.lookAt(plane.position.clone().add(new THREE.Vector3(0, 1.5, -10).applyQuaternion(plane.quaternion)));
      }

      // Keep infinite city loop illusion
      if (Math.abs(plane.position.z) > 1800) plane.position.z *= -0.9;
      if (Math.abs(plane.position.x) > 1800) plane.position.x *= -0.9;
      if (plane.position.y < 3) plane.position.y = 3; // Crash deck

      // Update HUD
      document.getElementById('hudSpd').innerText = Math.round(forwardSpeed * 120);
      document.getElementById('hudAlt').innerText = Math.max(0, Math.round(plane.position.y * 15));

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
