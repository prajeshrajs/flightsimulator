<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroFlight Sim - Standard Visual Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #uiLayer {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 10;
    }
    #menuBar {
      position: absolute;
      top: 16px; left: 16px;
      pointer-events: auto;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    #btnBle { background: #2563eb; }
    #btnUsb { background: #059669; }

    /* Aviation HUD */
    #hudCanvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 500px; height: 500px;
      pointer-events: none;
    }
    #sysInfo {
      position: absolute;
      bottom: 20px; left: 20px;
      color: #38bdf8;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.6;
      background: rgba(15, 23, 42, 0.75);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(4px);
    }
    #crashNotice {
      position: absolute;
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ef4444;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 0 0 20px rgba(239,68,68,0.9), 0 0 4px #000;
      display: none;
      text-align: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="uiLayer">
    <div id="menuBar">
      <button class="btn" id="btnBle">Connect BLE</button>
      <button class="btn" id="btnUsb">Connect USB</button>
    </div>
    <canvas id="hudCanvas" width="500" height="500"></canvas>
    <div id="crashNotice">TERRAIN IMPACT<br><span style="font-size: 16px; color: #fff;">RESPAWNING...</span></div>
    <div id="sysInfo">
      <div>LINK:  <span id="txtLink">KEYBOARD READY</span></div>
      <div>IAS:   <span id="txtSpd">0</span> KTS</div>
      <div>ALT:   <span id="txtAlt">0</span> FT</div>
      <div>VS:    <span id="txtVs">0</span> FPM</div>
      <div>G-LOAD:<span id="txtG">1.0</span> G</div>
    </div>
  </div>

  <script>
    // --- 1. Scene, Atmospheric Lighting & Shading ---
    const scene = new THREE.Scene();
    const skyColor = new THREE.Color(0x7eaed6);
    scene.background = skyColor;
    scene.fog = new THREE.FogExp2(0x7eaed6, 0.00045);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 9000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x475569, 0.85);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfff7ed, 1.4);
    sun.position.set(1200, 2400, 800);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    const d = 1200;
    sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
    sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
    scene.add(sun);

    // --- 2. Procedural Mountain Valley Terrain ---
    const mapSize = 14000;
    const segments = 120;
    const terrainGeo = new THREE.PlaneGeometry(mapSize, mapSize, segments, segments);
    terrainGeo.rotateX(-Math.PI / 2);

    const pos = terrainGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      // Flat central valley corridor for clean flight
      const distFromCenter = Math.abs(x);
      let y = 0;
      if (distFromCenter > 220) {
        const factor = Math.min(1, (distFromCenter - 220) / 1200);
        y = (Math.sin(x * 0.003) * Math.cos(z * 0.003) * 220 +
             Math.sin(x * 0.008 + z * 0.006) * 110 +
             Math.cos(z * 0.0018) * 320) * factor;
        if (y < 0) y = 0;
      }
      pos.setY(i, y);
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshLambertMaterial({ color: 0x3d4a36, wireframe: false });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // Paved Runway Strip
    const runway = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 4200),
      new THREE.MeshLambertMaterial({ color: 0x1e2429 })
    );
    runway.rotation.x = -Math.PI / 2;
    runway.position.set(0, 0.4, 0);
    runway.receiveShadow = true;
    scene.add(runway);

    // Centerline dashes
    const dashMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    for (let z = -2000; z <= 2000; z += 50) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 20), dashMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(0, 0.6, z);
      scene.add(dash);
    }

    // --- 3. Aircraft 3D Model ---
    const plane = new THREE.Group();
    const matFuselage = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.35 });
    const matAccent   = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.35 });
    const matCanopy   = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.8 });
    const matEngine   = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });

    // Streamlined Aero Fuselage
    const fuse = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 0.7, 18, 16), matFuselage);
    fuse.rotation.x = Math.PI / 2;
    fuse.castShadow = true;
    plane.add(fuse);

    const nose = new THREE.Mesh(new THREE.ConeGeometry(1.3, 4.2, 16), matFuselage);
    nose.rotation.x = -Math.PI / 2;
    nose.position.z = -11.1;
    nose.castShadow = true;
    plane.add(nose);

    const canopy = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 12), matCanopy);
    canopy.scale.set(0.65, 0.75, 2.4);
    canopy.position.set(0, 1.1, -2.5);
    plane.add(canopy);

    // Tapered Swept Wings
    const wingShape = new THREE.BoxGeometry(26, 0.32, 4);
    const wings = new THREE.Mesh(wingShape, matAccent);
    wings.position.set(0, 0.1, 0.2);
    wings.castShadow = true;
    plane.add(wings);

    // Tail Assembly
    const vFin = new THREE.Mesh(new THREE.BoxGeometry(0.35, 4.2, 3.4), matAccent);
    vFin.position.set(0, 2.4, 8);
    vFin.castShadow = true;
    plane.add(vFin);

    const hStab = new THREE.Mesh(new THREE.BoxGeometry(9.6, 0.25, 2.4), matFuselage);
    hStab.position.set(0, 0.9, 8.4);
    hStab.castShadow = true;
    plane.add(hStab);

    // Twin Engines & Props
    const props = [];
    [-4.8, 4.8].forEach(x => {
      const pod = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 4.8, 14), matEngine);
      pod.rotation.x = Math.PI / 2;
      pod.position.set(x, -0.2, 0.4);
      pod.castShadow = true;
      plane.add(pod);

      const propGroup = new THREE.Group();
      propGroup.position.set(x, -0.2, -2.2);
      const blade = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.45, 0.08), matEngine);
      propGroup.add(blade);
      plane.add(propGroup);
      props.push(propGroup);
    });

    plane.position.set(0, 100, 1200);
    scene.add(plane);

    // --- 4. Authentic Primary Flight Display HUD (2D Canvas) ---
    const hud = document.getElementById('hudCanvas').getContext('2d');
    function drawHUD(pitchDeg, rollDeg, speedKts, altFt) {
      hud.clearRect(0, 0, 500, 500);
      const cx = 250, cy = 250;

      hud.save();
      hud.translate(cx, cy);
      hud.rotate(-rollDeg * Math.PI / 180);

      // Pitch Ladder Lines
      hud.strokeStyle = '#38bdf8';
      hud.fillStyle = '#38bdf8';
      hud.lineWidth = 2;
      hud.font = '11px monospace';

      const pxPerDeg = 4.2;
      for (let p = -40; p <= 40; p += 10) {
        if (p === 0) continue;
        const y = - (p - pitchDeg) * pxPerDeg;
        if (y < -150 || y > 150) continue;

        const w = (p % 20 === 0) ? 65 : 40;
        hud.beginPath();
        hud.moveTo(-w, y); hud.lineTo(-12, y);
        hud.moveTo(12, y); hud.lineTo(w, y);
        hud.stroke();
        hud.fillText(Math.abs(p), w + 4, y + 4);
      }

      // Artificial Horizon Center Bar
      const horizonY = pitchDeg * pxPerDeg;
      hud.lineWidth = 2.5;
      hud.beginPath();
      hud.moveTo(-130, horizonY); hud.lineTo(-25, horizonY);
      hud.moveTo(25, horizonY); hud.lineTo(130, horizonY);
      hud.stroke();

      hud.restore();

      // Fixed Aircraft Reticle
      hud.strokeStyle = '#facc15';
      hud.lineWidth = 2.5;
      hud.beginPath();
      hud.moveTo(cx - 30, cy); hud.lineTo(cx - 10, cy);
      hud.lineTo(cx - 5, cy + 8);
      hud.moveTo(cx + 30, cy); hud.lineTo(cx + 10, cy);
      hud.lineTo(cx + 5, cy + 8);
      hud.stroke();

      hud.beginPath();
      hud.arc(cx, cy, 3, 0, Math.PI * 2);
      hud.fillStyle = '#facc15';
      hud.fill();
    }

    // --- 5. Aerodynamic Flight Model ---
    let targetPitch = 0, targetRoll = 0;
    let curPitch = 0, curRoll = 0, curYaw = 0;
    let flightSpeed = 2.4;
    let lastY = 100;
    let isCrashed = false;

    function resetAircraft() {
      plane.position.set(0, 120, plane.position.z);
      curPitch = 0; curRoll = 0; curYaw = 0;
      targetPitch = 0; targetRoll = 0;
      plane.visible = true;
      isCrashed = false;
      document.getElementById('crashNotice').style.display = 'none';
    }

    function triggerCrash() {
      if (isCrashed) return;
      isCrashed = true;
      plane.visible = false;
      document.getElementById('crashNotice').style.display = 'block';
      setTimeout(resetAircraft, 1800);
    }

    // --- 6. Controls (BLE, USB & Keyboard) ---
    // Bluetooth (BLE)
    document.getElementById('btnBle').addEventListener('click', async () => {
      try {
        const dev = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_Flight_Stick' }],
          optionalServices: ["4fafc201-1fb5-459e-8fcc-c5c9c331914b"]
        });
        const server = await dev.gatt.connect();
        const srv = await server.getPrimaryService("4fafc201-1fb5-459e-8fcc-c5c9c331914b");
        const char = await srv.getCharacteristic("beb5483e-36e1-4688-b7f5-ea07361b26a8");
        await char.startNotifications();
        document.getElementById('txtLink').innerText = 'BLE LINK ACTIVE';
        document.getElementById('menuBar').style.display = 'none';

        const dec = new TextDecoder('utf-8');
        char.addEventListener('characteristicvaluechanged', (e) => {
          try {
            const d = JSON.parse(dec.decode(e.target.value));
            if (d.p !== undefined) targetPitch = THREE.MathUtils.clamp((d.p * Math.PI) / 180, -0.9, 0.9);
            if (d.r !== undefined) targetRoll  = THREE.MathUtils.clamp((-d.r * Math.PI) / 180, -1.2, 1.2);
          } catch(err) {}
        });
      } catch (err) { alert("BLE Error: " + err.message); }
    });

    // USB Web Serial
    document.getElementById('btnUsb').addEventListener('click', async () => {
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        document.getElementById('txtLink').innerText = 'USB SERIAL ACTIVE';
        document.getElementById('menuBar').style.display = 'none';

        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable);
        const reader = decoder.readable.getReader();
        let buf = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            try {
              const d = JSON.parse(line.trim());
              if (d.pitch !== undefined) targetPitch = THREE.MathUtils.clamp((d.pitch * Math.PI) / 180, -0.9, 0.9);
              if (d.roll !== undefined)  targetRoll  = THREE.MathUtils.clamp((-d.roll * Math.PI) / 180, -1.2, 1.2);
            } catch(e) {}
          }
        }
      } catch (err) { alert("USB Error: " + err.message); }
    });

    // Keyboard Fallback
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft'  || e.key === 'a') targetRoll = 0.75;
      if (e.key === 'ArrowRight' || e.key === 'd') targetRoll = -0.75;
      if (e.key === 'ArrowUp'    || e.key === 'w') targetPitch = -0.5;
      if (e.key === 'ArrowDown'  || e.key === 's') targetPitch = 0.5;
    });
    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft','ArrowRight','a','d'].includes(e.key)) targetRoll = 0;
      if (['ArrowUp','ArrowDown','w','s'].includes(e.key)) targetPitch = 0;
    });

    // --- 7. Main Flight Loop ---
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');

    function animate() {
      requestAnimationFrame(animate);

      if (!isCrashed) {
        // Aerodynamic inertia & banking physics
        curRoll += (targetRoll - curRoll) * 0.085;
        curPitch += (targetPitch - curPitch) * 0.085;
        curYaw += -curRoll * 0.024; // Lift vector yaw turn

        euler.set(curPitch, curYaw, curRoll, 'YXZ');
        plane.quaternion.setFromEuler(euler);

        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(plane.quaternion);
        plane.position.addScaledVector(fwd, flightSpeed);

        // Ground / Mountain Elevation Collision Detection
        let groundFloor = 1.8;
        const xDist = Math.abs(plane.position.x);
        if (xDist > 220) {
          groundFloor += (xDist - 220) * 0.28;
        }
        if (plane.position.y <= groundFloor) {
          triggerCrash();
        }
      }

      // Map boundary wrap
      if (Math.abs(plane.position.z) > mapSize / 2 - 200) plane.position.z *= -0.96;
      if (Math.abs(plane.position.x) > mapSize / 2 - 200) plane.position.x *= -0.96;

      props.forEach(p => p.rotation.z += 0.85);

      // Chase Camera
      const chaseOffset = new THREE.Vector3(0, 7.5, 28).applyQuaternion(plane.quaternion);
      camera.position.lerp(plane.position.clone().add(chaseOffset), 0.2);
      camera.lookAt(plane.position.clone().add(new THREE.Vector3(0, 1.2, -14).applyQuaternion(plane.quaternion)));

      // Telemetry Calculations
      const ias = Math.round(flightSpeed * 85);
      const alt = Math.max(0, Math.round(plane.position.y * 7));
      const vs  = Math.round((plane.position.y - lastY) * 60 * 7);
      lastY = plane.position.y;

      const pDeg = curPitch * 180 / Math.PI;
      const rDeg = curRoll * 180 / Math.PI;

      drawHUD(pDeg, rDeg, ias, alt);

      document.getElementById('txtSpd').innerText = ias;
      document.getElementById('txtAlt').innerText = alt;
      document.getElementById('txtVs').innerText  = vs;
      document.getElementById('txtG').innerText   = (1.0 + Math.abs(curRoll) * 0.8).toFixed(1);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
