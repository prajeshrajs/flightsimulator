<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Bluetooth Flight Simulator - Arcade Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #5b8296;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }
    #connectBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #1d4ed8;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    #connectBtn:hover {
      background: #1d4ed8;
      transform: scale(1.03);
    }
    #flightDeck {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 50;
      color: #38bdf8;
      text-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
      font-size: 13px;
      line-height: 1.6;
      pointer-events: none;
      display: none;
      background: rgba(15, 23, 42, 0.88);
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(4px);
    }
    #crashAlert {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ef4444;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 6px;
      text-shadow: 0 0 24px rgba(239, 68, 68, 0.9), 0 0 8px #000;
      display: none;
      z-index: 99;
      pointer-events: none;
      text-align: center;
    }
    #ringToast {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #facc15;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.8), 0 0 5px #000;
      display: none;
      z-index: 80;
      pointer-events: none;
      animation: popFade 0.6s ease-out forwards;
    }
    @keyframes popFade {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      pointer-events: none;
      display: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(56, 189, 248, 0.9);
      box-shadow: 0 0 5px rgba(56, 189, 248, 0.8);
    }
    #crosshair::before { top: 15px; left: 0; width: 32px; height: 2px; }
    #crosshair::after { top: 0; left: 15px; width: 2px; height: 32px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <button id="connectBtn">Connect Bluetooth Controller</button>
  <div id="crashAlert">CRASH DETECTED<br><span style="font-size: 18px; color: #fff;">RESPAWNING...</span></div>
  <div id="ringToast">+250 PTS</div>
  <div id="crosshair"></div>
  <div id="flightDeck">
    <div><b>[TELEMETRY]</b> WIRELESS BLE ACTIVE</div>
    <div>ALT:   <span id="hudAlt">0</span> FT</div>
    <div>IAS:   <span id="hudSpd">0</span> KTS</div>
    <div>HDG:   <span id="hudHdg">000</span>°</div>
    <div>SCORE: <span id="hudScore">0</span> PTS</div>
    <div>VIEW:  <span id="hudCam">CHASE (3RD)</span></div>
  </div>

  <script>
    // --- 1. Procedural Web Audio Engine ---
    let audioCtx, engineOsc, engineGain, noiseNode;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Twin-Turboprop Low Rumble Oscillator
      engineOsc = audioCtx.createOscillator();
      engineOsc.type = 'sawtooth';
      engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(320, audioCtx.currentTime);

      engineGain = audioCtx.createGain();
      engineGain.gain.setValueAtTime(0.04, audioCtx.currentTime);

      engineOsc.connect(filter);
      filter.connect(engineGain);
      engineGain.connect(audioCtx.destination);
      engineOsc.start();

      // Wind / Airflow Noise
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(600, audioCtx.currentTime);
      noiseFilter.Q.setValueAtTime(1.5, audioCtx.currentTime);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.015, audioCtx.currentTime);

      whiteNoise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      whiteNoise.start();
    }

    function playRingChime() {
      if (!audioCtx) return;
      const chime = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      chime.type = 'sine';
      chime.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
      chime.frequency.exponentialRampToValueAtTime(880.00, audioCtx.currentTime + 0.12); // A5
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      chime.connect(gain);
      gain.connect(audioCtx.destination);
      chime.start();
      chime.stop(audioCtx.currentTime + 0.4);
    }

    function playExplosionSound() {
      if (!audioCtx) return;
      const boom = audioCtx.createOscillator();
      const boomGain = audioCtx.createGain();
      boom.type = 'square';
      boom.frequency.setValueAtTime(110, audioCtx.currentTime);
      boom.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
      boomGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      boomGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
      boom.connect(boomGain);
      boomGain.connect(audioCtx.destination);
      boom.start();
      boom.stop(audioCtx.currentTime + 0.6);
    }

    // --- 2. Three.js Scene, Lighting & Atmospheric Fog ---
    const scene = new THREE.Scene();
    const skyCol = new THREE.Color(0x60869b);
    scene.background = skyCol;
    scene.fog = new THREE.Fog(0x60869b, 500, 3600);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.2, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xdce6ee, 0.9);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff5e6, 1.4);
    sun.position.set(500, 1000, 400);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    const d = 1000;
    sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
    sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
    scene.add(sun);

    // --- 3. Long Ground Corridor & Skybridge City ---
    const MAP_LIMIT_Z = 9000;
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x3d4447 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(4500, MAP_LIMIT_Z * 2), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const avenueMat = new THREE.MeshLambertMaterial({ color: 0x1f2326 });
    const avenue = new THREE.Mesh(new THREE.PlaneGeometry(90, MAP_LIMIT_Z * 2), avenueMat);
    avenue.rotation.x = -Math.PI / 2;
    avenue.position.y = 0.1;
    avenue.receiveShadow = true;
    scene.add(avenue);

    const dashMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
    for (let z = -MAP_LIMIT_Z + 100; z < MAP_LIMIT_Z - 100; z += 35) {
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 16), dashMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(0, 0.15, z);
      scene.add(dash);
    }

    const colliders = [];
    const bPalette = [0x38414a, 0x4a4542, 0x2e343b, 0x5a554f, 0x24282e];

    function createMegaSkyscraper(x, z, customW, customD, customH) {
      const group = new THREE.Group();
      const col = bPalette[Math.floor(Math.random() * bPalette.length)];
      const mat = new THREE.MeshLambertMaterial({ color: col });

      let width = customW || (60 + Math.random() * 30);
      let depth = customD || (60 + Math.random() * 30);
      let curY = 0;
      const tiers = customH ? 3 : (3 + Math.floor(Math.random() * 3));

      for (let i = 0; i < tiers; i++) {
        const tierH = customH ? (customH / tiers) : (60 + Math.random() * 80);
        const tier = new THREE.Mesh(new THREE.BoxGeometry(width, tierH, depth), mat);
        tier.position.y = curY + tierH / 2;
        tier.castShadow = true;
        tier.receiveShadow = true;
        group.add(tier);

        colliders.push({
          minX: x - width / 2, maxX: x + width / 2,
          minZ: z - depth / 2, maxZ: z + depth / 2,
          minY: 0, maxY: curY + tierH
        });

        curY += tierH;
        width *= 0.75; depth *= 0.75;
      }

      if (curY > 180) {
        const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 3.5, 45, 8), mat);
        spire.position.y = curY + 22.5;
        spire.castShadow = true;
        group.add(spire);
      }

      group.position.set(x, 0, z);
      scene.add(group);
    }

    function createSkybridgeComplex(centerZ) {
      const span = 160;
      createMegaSkyscraper(-span, centerZ, 80, 80, 280);
      createMegaSkyscraper(span, centerZ, 80, 80, 280);

      const bridgeMat = new THREE.MeshLambertMaterial({ color: 0x252b33 });
      [110, 190].forEach(h => {
        const b = new THREE.Mesh(new THREE.BoxGeometry(span * 2, 16, 26), bridgeMat);
        b.position.set(0, h, centerZ);
        b.castShadow = true;
        b.receiveShadow = true;
        scene.add(b);

        colliders.push({
          minX: -span, maxX: span,
          minZ: centerZ - 13, maxZ: centerZ + 13,
          minY: h - 8, maxY: h + 8
        });
      });
    }

    for (let z = -8400; z <= 8400; z += 220) {
      if (Math.abs(z) % 2200 === 0) {
        createSkybridgeComplex(z);
        continue;
      }
      for (let x = -650; x <= 650; x += 130) {
        if (Math.abs(x) < 80) continue;
        createMegaSkyscraper(x, z);
      }
    }

    // --- 4. Holographic Aerial Rings (Flight Course) ---
    const rings = [];
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
    for (let i = 0; i < 28; i++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(14, 1.2, 8, 24), ringMat);
      ring.position.set(
        (Math.random() - 0.5) * 60,
        50 + Math.random() * 110,
        -MAP_LIMIT_Z + 400 + i * 580
      );
      ring.rotation.x = Math.PI / 2;
      scene.add(ring);
      rings.push(ring);
    }

    // --- 5. Aerobatics Plane Model & Contrails ---
    const plane = new THREE.Group();
    const planeMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const trimMat = new THREE.MeshLambertMaterial({ color: 0x1d4ed8 });
    const engineMat = new THREE.MeshLambertMaterial({ color: 0x1f2937 });

    const fuse = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 0.8, 18, 14), planeMat);
