<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Motion Flight Simulator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #7ca5be;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #connectBtn {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 100;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 14px;
      background: #ffffff;
      color: #111111;
      border: 2px solid #222222;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #connectBtn:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
    }
    #hud {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 50;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <button id="connectBtn">Connect ESP32</button>
  <div id="hud">
    <div>[SYS] SERIAL LINK ACTIVE</div>
    <div>SPD:  <span id="hudSpd">120</span> KTS</div>
    <div>ALT:  <span id="hudAlt">340</span> FT</div>
    <div>CAM:  <span id="hudCam">CHASE (3RD)</span></div>
  </div>

  <script>
    // --- 1. Scene, Camera & Atmosphere ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x89aabf);
    scene.fog = new THREE.Fog(0x89aabf, 300, 1500);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Warm Sun & Sky Ambient
    const ambientLight = new THREE.AmbientLight(0xdde5ed, 0.85);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xfff7e6, 1.4);
    sun.position.set(300, 500, 200);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 1500;
    const d = 500;
    sun.shadow.camera.left = -d;
    sun.shadow.camera.right = d;
    sun.shadow.camera.top = d;
    sun.shadow.camera.bottom = -d;
    scene.add(sun);

    // --- 2. Ground Terrain & Roads ---
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x6e7678 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Main Avenue (Where the plane flies down between the high-rises)
    const avenueMat = new THREE.MeshLambertMaterial({ color: 0x333538 });
    const avenue = new THREE.Mesh(new THREE.PlaneGeometry(50, 3000), avenueMat);
    avenue.rotation.x = -Math.PI / 2;
    avenue.position.y = 0.1;
    avenue.receiveShadow = true;
    scene.add(avenue);

    // Yellow Dashed Center-line
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xf5b041 });
    for (let z = -1400; z < 1400; z += 30) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 14), lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(0, 0.2, z);
      scene.add(line);
    }

    // --- 3. Stepped NYC Skyscraper Generator ---
    const bPalette = [0x505763, 0x635b53, 0x48515c, 0x7a746d, 0x3d434d];
    function buildSkyscraper(x, z) {
      const group = new THREE.Group();
      const col = bPalette[Math.floor(Math.random() * bPalette.length)];
      const mat = new THREE.MeshLambertMaterial({ color: col });

      let baseW = 38 + Math.random() * 18;
      let baseD = 38 + Math.random() * 18;
      let currentY = 0;
      const tiers = 3 + Math.floor(Math.random() * 3);

      for (let t = 0; t < tiers; t++) {
        const tierH = 25 + Math.random() * 45;
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(baseW, tierH, baseD), mat);
        mesh.position.y = currentY + tierH / 2;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
        currentY += tierH;
        baseW *= 0.72;
        baseD *= 0.72;
      }

      // Spire on tall buildings
      if (currentY > 110) {
        const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 2.5, 30, 8), mat);
        spire.position.y = currentY + 15;
        spire.castShadow = true;
        group.add(spire);
      }

      group.position.set(x, 0, z);
      return group;
    }

    // City Grid & Central Park Blocks
    const blockSize = 65;
    for (let x = -600; x <= 600; x += blockSize) {
      for (let z = -1200; z <= 1200; z += blockSize) {
        if (Math.abs(x) < 40) continue; // Keep center flight path clear

        // Central Park Green Belt area
        if (x > 70 && x < 260 && z > -250 && z < 250) {
          if (Math.random() > 0.4) {
            // Park grass patch
            const grass = new THREE.Mesh(new THREE.PlaneGeometry(55, 55), new THREE.MeshLambertMaterial({ color: 0x477843 }));
            grass.rotation.x = -Math.PI / 2;
            grass.position.set(x, 0.15, z);
            scene.add(grass);

            // Trees
            for (let tr = 0; tr < 3; tr++) {
              const tree = new THREE.Mesh(new THREE.ConeGeometry(3, 8, 6), new THREE.MeshLambertMaterial({ color: 0x2e592b }));
              tree.position.set(x + (Math.random() - 0.5) * 35, 4, z + (Math.random() - 0.5) * 35);
              scene.add(tree);
            }
          }
          continue;
        }

        scene.add(buildSkyscraper(x, z));
      }
    }

    // --- 4. Dynamic Moving Traffic ---
    const traffic = [];
    const carColors = [0xd32f2f, 0x1976d2, 0xffffff, 0xfbc02d, 0x212121];
    for (let i = 0; i < 50; i++) {
      const carGroup = new THREE.Group();
      const col = carColors[i % carColors.length];
      const carBody = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.8, 6.5), new THREE.MeshLambertMaterial({ color: col }));
      carBody.position.y = 1;
      carBody.castShadow = true;
      carGroup.add(carBody);

      // Headlights
      const hlMat = new THREE.MeshBasicMaterial({ color: 0xfff0aa });
      const hlL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.2), hlMat);
      hlL.position.set(-1, 0.9, -3.3);
      const hlR = hlL.clone();
      hlR.position.x = 1;
      carGroup.add(hlL);
      carGroup.add(hlR);

      const lane = (i % 2 === 0) ? -10 : 10;
      carGroup.position.set(lane, 0, (Math.random() - 0.5) * 2600);
      carGroup.userData = { speed: (i % 2 === 0 ? 1 : -1) * (0.9 + Math.random() * 0.7) };
      if (i % 2 !== 0) carGroup.rotation.y = Math.PI;

      scene.add(carGroup);
      traffic.push(carGroup);
    }

    // --- 5. Exact Airplane Model (Twin-Engine Low-Poly Plane) ---
    const plane = new THREE.Group();
    const planeBodyMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const planeAccentMat = new THREE.MeshLambertMaterial({ color: 0x194b8c });
    const darkDetailsMat = new THREE.MeshLambertMaterial({ color: 0x26292b });

    // Fuselage Core
    const fuselageGeo = new THREE.CylinderGeometry(1.3, 0.8, 17, 12);
    fuselageGeo.rotateX(Math.PI / 2);
    const fuselage = new THREE.Mesh(fuselageGeo, planeBodyMat);
    fuselage.castShadow = true;
    plane.add(fuselage);

    // Aerodynamic Nose Cone
    const noseGeo = new THREE.ConeGeometry(1.3, 4, 12);
    noseGeo.rotateX(-Math.PI / 2);
    const nose = new THREE.Mesh(noseGeo, planeBodyMat);
    nose.position.z = -10.5;
    nose.castShadow = true;
    plane.add(nose);

    // Main Wings with Blue Tips
    const wingGeo = new THREE.BoxGeometry(26, 0.35, 3.8);
    const wings = new THREE.Mesh(wingGeo, planeBodyMat);
    wings.position.set(0, 0.2, 0.5);
    wings.castShadow = true;
    plane.add(wings);

    const wingTips = new THREE.Mesh(new THREE.BoxGeometry(26.2, 0.38, 1.2), planeAccentMat);
    wingTips.position.set(0, 0.2, 2.2);
    plane.add(wingTips);

    // Tail Fin & Rudder
    const vTail = new THREE.Mesh(new THREE.BoxGeometry(0.35, 4, 3), planeAccentMat);
    vTail.position.set(0, 2.2, 7.5);
    vTail.castShadow = true;
    plane.add(vTail);

    const hTail = new THREE.Mesh(new THREE.BoxGeometry(9, 0.25, 2.2), planeBodyMat);
    hTail.position.set(0, 0.8, 7.8);
    hTail.castShadow = true;
    plane.add(hTail);

    // Twin Engines and Propellers
    const props = [];
    [-4.8, 4.8].forEach(xOff => {
      // Nacelle
      const nacelleGeo = new THREE.CylinderGeometry(0.9, 0.9, 5, 12);
      nacelleGeo.rotateX(Math.PI / 2);
      const nacelle = new THREE.Mesh(nacelleGeo, darkDetailsMat);
      nacelle.position.set(xOff, -0.2, 0.5);
      nacelle.castShadow = true;
      plane.add(nacelle);

      // Propeller Hub
      const hub = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 8), darkDetailsMat);
      hub.rotateX(-Math.PI / 2);
      hub.position.set(xOff, -0.2, -2.5);
      plane.add(hub);

      // Blades
      const bladeGroup = new THREE.Group();
      bladeGroup.position.set(xOff, -0.2, -2.4);
      const blade1 = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.45, 0.08), new THREE.MeshBasicMaterial({ color: 0x111111 }));
      bladeGroup.add(blade1);
      plane.add(bladeGroup);
      props.push(bladeGroup);
    });

    plane.position.set(0, 75, 0);
    scene.add(plane);

    // --- 6. Controller State & Serial Handling ---
    let targetPitch = 0;
    let targetRoll = 0;
    let currentPitch = 0;
    let currentRoll = 0;
    let currentYaw = 0;
    let flightSpeed = 1.85;
    let isFirstPerson = false;

    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        document.getElementById('connectBtn').style.display = 'none';
        document.getElementById('hud').style.display = 'block';

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        const reader = textDecoder.readable.getReader();

        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            try {
              const data = JSON.parse(line.trim());
              // MPU6050 accelerometer mapping
              targetRoll = -(data.ay / 9.8) * 1.35;
              targetPitch = (data.ax / 9.8) * 0.95;

              // Push button toggles First Person / Third Person camera
              if (data.btn === 1) {
                isFirstPerson = !isFirstPerson;
                document.getElementById('hudCam').innerText = isFirstPerson ? 'FIRST PERSON (COCKPIT)' : 'CHASE (3RD)';
              }
            } catch (e) {}
          }
        }
      } catch (err) {
        console.error("Serial error:", err);
      }
    });

    // --- 7. Animation Loop ---
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    function animate() {
      requestAnimationFrame(animate);

      // Smooth mechanical interpolation
      currentRoll += (targetRoll - currentRoll) * 0.075;
      currentPitch += (targetPitch - currentPitch) * 0.075;
      currentYaw += -currentRoll * 0.024; // Dynamic bank-to-turn

      euler.set(currentPitch, currentYaw, currentRoll, 'YXZ');
      plane.quaternion.setFromEuler(euler);

      // Forward continuous thrust
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(plane.quaternion);
      plane.position.addScaledVector(forward, flightSpeed);

      // Infinite city looping illusion
      if (Math.abs(plane.position.z) > 1300) plane.position.z *= -0.92;
      if (Math.abs(plane.position.x) > 550) plane.position.x *= -0.92;
      if (plane.position.y < 8) plane.position.y = 8; // Altitude safety floor

      // Spin twin propellers
      props.forEach(p => p.rotation.z += 0.7);

      // Move city traffic
      traffic.forEach(car => {
        car.position.z += car.userData.speed;
        if (car.position.z > 1400) car.position.z = -1400;
        if (car.position.z < -1400) car.position.z = 1400;
      });

      // Camera Modes
      if (isFirstPerson) {
        // Cockpit Camera POV (directly at the nose)
        camera.position.copy(plane.position);
        camera.quaternion.copy(plane.quaternion);
        camera.translateZ(-3.8);
        camera.translateY(0.7);
      } else {
        // Third Person Chase Cam (elevated rear view)
        const offset = new THREE.Vector3(0, 7.5, 30).applyQuaternion(plane.quaternion);
        camera.position.lerp(plane.position.clone().add(offset), 0.22);
        camera.lookAt(plane.position.clone().add(new THREE.Vector3(0, 1.2, -12).applyQuaternion(plane.quaternion)));
      }

      // Live HUD readouts
      document.getElementById('hudSpd').innerText = Math.round(flightSpeed * 85);
      document.getElementById('hudAlt').innerText = Math.round(plane.position.y * 7);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
