<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroFlight Sim - Metropolis Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #uiLayer {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 10;
    }
    #menuBar {
      position: absolute;
      top: 16px; left: 16px;
      pointer-events: auto;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    #btnBle { background: #2563eb; }
    #btnUsb { background: #059669; }

    #hudCanvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 500px; height: 500px;
      pointer-events: none;
    }
    #sysInfo {
      position: absolute;
      bottom: 20px; left: 20px;
      color: #38bdf8;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.6;
      background: rgba(15, 23, 42, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(6px);
    }
    #crashNotice {
      position: absolute;
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      color: #ef4444;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 0 0 24px rgba(239,68,68,0.9), 0 0 4px #000;
      display: none;
      text-align: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="uiLayer">
    <div id="menuBar">
      <button class="btn" id="btnBle">Connect BLE</button>
      <button class="btn" id="btnUsb">Connect USB</button>
    </div>
    <canvas id="hudCanvas" width="500" height="500"></canvas>
    <div id="crashNotice">STRUCTURE COLLISION<br><span style="font-size: 16px; color: #fff;">RESPAWNING...</span></div>
    <div id="sysInfo">
      <div>LINK:  <span id="txtLink">KEYBOARD ACTIVE</span></div>
      <div>IAS:   <span id="txtSpd">0</span> KTS</div>
      <div>ALT:   <span id="txtAlt">0</span> FT</div>
      <div>VS:    <span id="txtVs">0</span> FPM</div>
      <div>G-LOAD:<span id="txtG">1.0</span> G</div>
    </div>
  </div>

  <script>
    // --- 1. Scene, Atmospheric Sunset Lighting & Fog ---
    const scene = new THREE.Scene();
    const skyColor = new THREE.Color(0xd47355); // Golden hour dusk
    scene.background = skyColor;
    scene.fog = new THREE.FogExp2(0xd47355, 0.00032);

    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.5, 9000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffecd2, 0x1e293b, 0.9);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xff9e58, 2.0);
    sun.position.set(1200, 700, -2200);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    const d = 1400;
    sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
    sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
    scene.add(sun);

    // --- 2. Ground Terrain & Water Harbor ---
    const MAP_LIMIT = 8000;
    const groundGeo = new THREE.PlaneGeometry(16000, 16000);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1b281f, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const waterGeo = new THREE.PlaneGeometry(2400, 16000);
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x0f2a3a, roughness: 0.1, metalness: 0.8 });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.set(1600, 0.1, 0);
    water.receiveShadow = true;
    scene.add(water);

    // --- 3. Procedural Window Texture Generator ---
    function createWindowCanvas(baseColorHex, litColorHex) {
      const cv = document.createElement('canvas');
      cv.width = 128; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = baseColorHex;
      ctx.fillRect(0, 0, 128, 256);

      const rows = 16, cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (Math.random() > 0.38) {
            ctx.fillStyle = litColorHex;
            ctx.fillRect(c * 16 + 3, r * 16 + 3, 10, 10);
          }
        }
      }
      return new THREE.CanvasTexture(cv);
    }

    const winTex1 = createWindowCanvas('#1e293b', '#fde047');
    const winTex2 = createWindowCanvas('#0f172a', '#38bdf8');
    winTex1.wrapS = winTex1.wrapT = THREE.RepeatWrapping;
    winTex2.wrapS = winTex2.wrapT = THREE.RepeatWrapping;

    // --- 4. Towers, City Grid & Bridges ---
    const colliders = [];
    const towerPalette = [
      new THREE.MeshStandardMaterial({ map: winTex1, roughness: 0.3, metalness: 0.4 }),
      new THREE.MeshStandardMaterial({ map: winTex2, roughness: 0.3, metalness: 0.5 }),
      new THREE.MeshStandardMaterial({ color: 0x1e2229, roughness: 0.2, metalness: 0.8 })
    ];

    function createDetailedTower(x, z, width, depth, height) {
      const group = new THREE.Group();
      const mat = towerPalette[Math.floor(Math.random() * towerPalette.length)];
      const bGeo = new THREE.BoxGeometry(width, height, depth);
      const bMesh = new THREE.Mesh(bGeo, mat);
      bMesh.position.y = height / 2;
      bMesh.castShadow = true;
      bMesh.receiveShadow = true;
      group.add(bMesh);

      // Rooftop Spire & Beacon Light
      if (height > 180) {
        const spireGeo = new THREE.CylinderGeometry(0.5, 3, 40, 8);
        const spire = new THREE.Mesh(spireGeo, new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9 }));
        spire.position.y = height + 20;
        group.add(spire);

        const beacon = new THREE.Mesh(
          new THREE.SphereGeometry(1.6, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xef4444 })
        );
        beacon.position.y = height + 40;
        group.add(beacon);
      }

      group.position.set(x, 0, z);
      scene.add(group);

      colliders.push({
        minX: x - width / 2, maxX: x + width / 2,
        minZ: z - depth / 2, maxZ: z + depth / 2,
        maxY: height
      });
    }

    // Grid Layout with Main Flight Boulevard
    for (let z = -MAP_LIMIT + 400; z <= MAP_LIMIT - 400; z += 240) {
      [-420, -300, -180, 180, 300, 420].forEach(x => {
        if (Math.random() > 0.25) {
          const h = 70 + Math.random() * 220;
          const w = 55 + Math.random() * 30;
          createDetailedTower(x, z, w, w, h);
        }
      });
    }

    // Skybridges crossing the central boulevard
    for (let z = -MAP_LIMIT + 1000; z <= MAP_LIMIT - 1000; z += 1800) {
      const bridge = new THREE.Mesh(
        new THREE.BoxGeometry(360, 18, 28),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.6 })
      );
      bridge.position.set(0, 120, z);
      bridge.castShadow = true;
      scene.add(bridge);
      colliders.push({
        minX: -180, maxX: 180, minZ: z - 14, maxZ: z + 14, maxY: 129, minY: 111
      });
    }

    // --- 5. Road Networks & Streetlights ---
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.9 });
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });

    function createRoad(x, z, w, len, isHoriz = false) {
      const road = new THREE.Mesh(new THREE.PlaneGeometry(w, len), roadMat);
      road.rotation.x = -Math.PI / 2;
      if (isHoriz) road.rotation.z = Math.PI / 2;
      road.position.set(x, 0.2, z);
      road.receiveShadow = true;
      scene.add(road);

      const dashes = new THREE.Mesh(new THREE.PlaneGeometry(isHoriz ? len : 1.8, isHoriz ? 1.8 : len), lineMat);
      dashes.rotation.x = -Math.PI / 2;
      dashes.position.set(x, 0.25, z);
      scene.add(dashes);
    }

    // Central Boulevard & Cross Avenues
    createRoad(0, 0, 75, MAP_LIMIT * 2);
    createRoad(-240, 0, 35, MAP_LIMIT * 2);
    createRoad(240, 0, 35, MAP_LIMIT * 2);
    for (let z = -MAP_LIMIT; z <= MAP_LIMIT; z += 900) {
      createRoad(0, z, 40, 1400, true);
    }

    // Runway Strip
    const runway = new THREE.Mesh(new THREE.PlaneGeometry(85, 3800), new THREE.MeshStandardMaterial({ color: 0x111827 }));
    runway.rotation.x = -Math.PI / 2;
    runway.position.set(800, 0.3, 0);
    runway.receiveShadow = true;
    scene.add(runway);

    // --- 6. Live Moving Traffic (Cars & Headlight Beams) ---
    const cars = [];
    const carGeos = [new THREE.BoxGeometry(3.5, 1.8, 6.5), new THREE.BoxGeometry(4, 2.6, 9.5)];
    const carColors = [0xef4444, 0x3b82f6, 0xffffff, 0xfacc15, 0x10b981];

    for (let i = 0; i < 90; i++) {
      const isBus = Math.random() > 0.8;
      const cMesh = new THREE.Mesh(
        isBus ? carGeos[1] : carGeos[0],
        new THREE.MeshStandardMaterial({ color: carColors[Math.floor(Math.random() * carColors.length)] })
      );

      // Glowing headlights & taillights
      const hl = new THREE.Mesh(new THREE.BoxGeometry(3, 0.6, 0.4), new THREE.MeshBasicMaterial({ color: 0xfffbeb }));
      hl.position.set(0, 0.2, -3.2);
      cMesh.add(hl);

      const tl = new THREE.Mesh(new THREE.BoxGeometry(3, 0.6, 0.4), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
      tl.position.set(0, 0.2, 3.2);
      cMesh.add(tl);

      const laneOffset = (Math.random() > 0.5 ? 1 : -1) * (8 + Math.random() * 14);
      cMesh.position.set(laneOffset, 1.2, (Math.random() - 0.5) * MAP_LIMIT);
      scene.add(cMesh);

      cars.push({
        mesh: cMesh,
        speed: (laneOffset > 0 ? 1 : -1) * (0.8 + Math.random() * 0.9),
        bound: MAP_LIMIT
      });
    }

    // --- 7. Aircraft 3D Model ---
    const plane = new THREE.Group();
    const matFuselage = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.35 });
    const matAccent   = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.35 });
    const matCanopy   = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.9 });
    const matEngine   = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });

    const fuse = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 0.7, 18, 16), matFuselage);
    fuse.rotation.x = Math.PI / 2;
    fuse.castShadow = true;
    plane.add(fuse);

    const nose = new THREE.Mesh(new THREE.ConeGeometry(1.3, 4.2, 16), matFuselage);
    nose.rotation.x = -Math.PI / 2;
    nose.position.z = -11.1;
    nose.castShadow = true;
    plane.add(nose);

    const canopy = new THREE.Mesh(new THREE.SphereGeometry(1.4, 16, 12), matCanopy);
    canopy.scale.set(0.65, 0.75, 2.4);
    canopy.position.set(0, 1.1, -2.5);
    plane.add(canopy);

    const wings = new THREE.Mesh(new THREE.BoxGeometry(26, 0.32, 4), matAccent);
    wings.position.set(0, 0.1, 0.2);
    wings.castShadow = true;
    plane.add(wings);

    const vFin = new THREE.Mesh(new THREE.BoxGeometry(0.35, 4.2, 3.4), matAccent);
    vFin.position.set(0, 2.4, 8);
    vFin.castShadow = true;
    plane.add(vFin);

    const hStab = new THREE.Mesh(new THREE.BoxGeometry(9.6, 0.25, 2.4), matFuselage);
    hStab.position.set(0, 0.9, 8.4);
    hStab.castShadow = true;
    plane.add(hStab);

    const props = [];
    [-4.8, 4.8].forEach(x => {
      const pod = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 4.8, 14), matEngine);
      pod.rotation.x = Math.PI / 2;
      pod.position.set(x, -0.2, 0.4);
      pod.castShadow = true;
      plane.add(pod);

      const propGroup = new THREE.Group();
      propGroup.position.set(x, -0.2, -2.2);
      const blade = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.45, 0.08), matEngine);
      propGroup.add(blade);
      plane.add(propGroup);
      props.push(propGroup);
    });

    plane.position.set(0, 95, 1200);
    scene.add(plane);

    // --- 8. HUD & Flight Telemetry ---
    const hud = document.getElementById('hudCanvas').getContext('2d');
    function drawHUD(pitchDeg, rollDeg, speedKts, altFt) {
      hud.clearRect(0, 0, 500, 500);
      const cx = 250, cy = 250;

      hud.save();
      hud.translate(cx, cy);
      hud.rotate(-rollDeg * Math.PI / 180);

      hud.strokeStyle = '#38bdf8';
      hud.fillStyle = '#38bdf8';
      hud.lineWidth = 2;
      hud.font = '11px monospace';

      const pxPerDeg = 4.2;
      for (let p = -40; p <= 40; p += 10) {
        if (p === 0) continue;
        const y = - (p - pitchDeg) * pxPerDeg;
        if (y < -150 || y > 150) continue;
        const w = (p % 20 === 0) ? 65 : 40;
        hud.beginPath();
        hud.moveTo(-w, y); hud.lineTo(-12, y);
        hud.moveTo(12, y); hud.lineTo(w, y);
        hud.stroke();
        hud.fillText(Math.abs(p), w + 4, y + 4);
      }

      const horizonY = pitchDeg * pxPerDeg;
      hud.lineWidth = 2.5;
      hud.beginPath();
      hud.moveTo(-130, horizonY); hud.lineTo(-25, horizonY);
      hud.moveTo(25, horizonY); hud.lineTo(130, horizonY);
      hud.stroke();
      hud.restore();

      // Fixed Crosshair Reticle
      hud.strokeStyle = '#facc15';
      hud.lineWidth = 2.5;
      hud.beginPath();
      hud.moveTo(cx - 30, cy); hud.lineTo(cx - 10, cy);
      hud.lineTo(cx - 5, cy + 8);
      hud.moveTo(cx + 30, cy); hud.lineTo(cx + 10, cy);
      hud.lineTo(cx + 5, cy + 8);
      hud.stroke();
      hud.beginPath();
      hud.arc(cx, cy, 3, 0, Math.PI * 2);
      hud.fillStyle = '#facc15';
      hud.fill();
    }

    // --- 9. Flight Controls & Collision Systems ---
    let targetPitch = 0, targetRoll = 0;
    let curPitch = 0, curRoll = 0, curYaw = 0;
    let flightSpeed = 2.5;
    let lastY = 95;
    let isCrashed = false;

    function resetPlane() {
      plane.position.set(0, 95, plane.position.z);
      curPitch = 0; curRoll = 0; curYaw = 0;
      targetPitch = 0; targetRoll = 0;
      plane.visible = true;
      isCrashed = false;
      document.getElementById('crashNotice').style.display = 'none';
    }

    function triggerCrash() {
      if (isCrashed) return;
      isCrashed = true;
      plane.visible = false;
      document.getElementById('crashNotice').style.display = 'block';
      setTimeout(resetPlane, 1800);
    }

    // BLE Connect
    document.getElementById('btnBle').addEventListener('click', async () => {
      try {
        const dev = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_Flight_Stick' }],
          optionalServices: ["4fafc201-1fb5-459e-8fcc-c5c9c331914b"]
        });
        const server = await dev.gatt.connect();
        const srv = await server.getPrimaryService("4fafc201-1fb5-459e-8fcc-c5c9c331914b");
        const char = await srv.getCharacteristic("beb5483e-36e1-4688-b7f5-ea07361b26a8");
        await char.startNotifications();
        document.getElementById('txtLink').innerText = 'BLE ACTIVE';
        document.getElementById('menuBar').style.display = 'none';

        const dec = new TextDecoder('utf-8');
        char.addEventListener('characteristicvaluechanged', (e) => {
          try {
            const d = JSON.parse(dec.decode(e.target.value));
            if (d.p !== undefined) targetPitch = THREE.MathUtils.clamp((d.p * Math.PI) / 180, -0.9, 0.9);
            if (d.r !== undefined) targetRoll  = THREE.MathUtils.clamp((-d.r * Math.PI) / 180, -1.2, 1.2);
          } catch(err) {}
        });
      } catch (err) { alert("BLE Error: " + err.message); }
    });

    // USB Connect
    document.getElementById('btnUsb').addEventListener('click', async () => {
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        document.getElementById('txtLink').innerText = 'USB ACTIVE';
        document.getElementById('menuBar').style.display = 'none';

        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable);
        const reader = decoder.readable.getReader();
        let buf = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            try {
              const d = JSON.parse(line.trim());
              if (d.pitch !== undefined) targetPitch = THREE.MathUtils.clamp((d.pitch * Math.PI) / 180, -0.9, 0.9);
              if (d.roll !== undefined)  targetRoll  = THREE.MathUtils.clamp((-d.roll * Math.PI) / 180, -1.2, 1.2);
            } catch(e) {}
          }
        }
      } catch (err) { alert("USB Error: " + err.message); }
    });

    // Keyboard Fallback
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft'  || e.key === 'a') targetRoll = 0.75;
      if (e.key === 'ArrowRight' || e.key === 'd') targetRoll = -0.75;
      if (e.key === 'ArrowUp'    || e.key === 'w') targetPitch = -0.5;
      if (e.key === 'ArrowDown'  || e.key === 's') targetPitch = 0.5;
    });
    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft','ArrowRight','a','d'].includes(e.key)) targetRoll = 0;
      if (['ArrowUp','ArrowDown','w','s'].includes(e.key)) targetPitch = 0;
    });

    // --- 10. Main Animation Loop ---
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');

    function animate() {
      requestAnimationFrame(animate);

      // Animate Traffic
      cars.forEach(car => {
        car.mesh.position.z += car.speed;
        if (car.mesh.position.z > car.bound) car.mesh.position.z = -car.bound;
        if (car.mesh.position.z < -car.bound) car.mesh.position.z = car.bound;
      });

      if (!isCrashed) {
        curRoll += (targetRoll - curRoll) * 0.085;
        curPitch += (targetPitch - curPitch) * 0.085;
        curYaw += -curRoll * 0.024;

        euler.set(curPitch, curYaw, curRoll, 'YXZ');
        plane.quaternion.setFromEuler(euler);

        const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(plane.quaternion);
        plane.position.addScaledVector(fwd, flightSpeed);

        // Ground check
        if (plane.position.y <= 1.8) triggerCrash();

        // High-rise & Bridge Collisions
        const px = plane.position.x, py = plane.position.y, pz = plane.position.z;
        for (let i = 0; i < colliders.length; i++) {
          const c = colliders[i];
          if (px > c.minX && px < c.maxX && pz > c.minZ && pz < c.maxZ) {
            if (c.minY !== undefined) {
              if (py >= c.minY && py <= c.maxY) { triggerCrash(); break; }
            } else if (py <= c.maxY) {
              triggerCrash();
              break;
            }
          }
        }
      }

      // Map boundary wrap
      if (Math.abs(plane.position.z) > MAP_LIMIT - 100) plane.position.z *= -0.96;
      if (Math.abs(plane.position.x) > 1200) plane.position.x *= -0.96;

      props.forEach(p => p.rotation.z += 0.85);

      // Chase Camera
      const chaseOffset = new THREE.Vector3(0, 7.5, 28).applyQuaternion(plane.quaternion);
      camera.position.lerp(plane.position.clone().add(chaseOffset), 0.2);
      camera.lookAt(plane.position.clone().add(new THREE.Vector3(0, 1.2, -14).applyQuaternion(plane.quaternion)));

      // Telemetry
      const ias = Math.round(flightSpeed * 85);
      const alt = Math.max(0, Math.round(plane.position.y * 7));
      const vs  = Math.round((plane.position.y - lastY) * 60 * 7);
      lastY = plane.position.y;

      drawHUD(curPitch * 180 / Math.PI, curRoll * 180 / Math.PI, ias, alt);

      document.getElementById('txtSpd').innerText = ias;
      document.getElementById('txtAlt').innerText = alt;
      document.getElementById('txtVs').innerText  = vs;
      document.getElementById('txtG').innerText   = (1.0 + Math.abs(curRoll) * 0.8).toFixed(1);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
